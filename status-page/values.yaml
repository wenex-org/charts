replicaCount: 1

fullnameOverride: "status-page"

serviceAccount:
  create: true
  automount: true

service:
  type: ClusterIP
  port: 80
  targetPort: 1045

livenessProbe:
  httpGet:
    path: /status
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /status
    port: http
  initialDelaySeconds: 15
  periodSeconds: 5
  failureThreshold: 3

ingress:
  enabled: false

autoscaling:
  enabled: false

global:
  image:
    repository: wenex/status-page
    pullPolicy: IfNotPresent
    tag: "latest"
  # **********************
  # Environment Variables
  # **********************
  envs:
    # History retention in days (older rows are pruned daily)
    retentionDays: 90
    # HTTP timeout (ms) for each resource health check
    checkTimeoutMs: 10000
  # **********************
  # Secrets
  # **********************
  secrets: {}
    # Default admin credentials (used only when seeding an empty database)
    # adminUsername: admin
    # adminPassword: admin
